name: ci
on: [push, pull_request]
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        working-directory: mac
        run: |
          mkdir -p out
          swiftc -O -swift-version 5 app/jester-hook.swift -o out/jester-hook
          swiftc -O -swift-version 5 app/main.swift app/Jester.swift app/JesterAudio.swift -o out/Jester \
            -framework AppKit -framework Carbon -framework AVFoundation
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Test and build
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: jester-android-unsigned
          path: android/app/build/outputs/apk/release/*.apk
