name: ci
on: [push, pull_request]
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        working-directory: mac
        run: ./build.sh "$RUNNER_TEMP/jester" && test -x "$RUNNER_TEMP/jester/Jester.app/Contents/MacOS/Jester"
      - name: CLI smoke test
        working-directory: mac
        run: |
          bash -n jester install.sh build.sh
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude" JESTER_HOOK=/usr/local/bin/jester-hook
          ./jester hooks install && ./jester hooks install | grep -q "nothing to change" && ./jester hooks status | grep -q "8/8"
          ./jester hooks uninstall && ./jester hooks status | grep -q "0/8"
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - name: Test and build
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - uses: actions/upload-artifact@v5
        with:
          name: jester-android-unsigned
          path: android/app/build/outputs/apk/release/*.apk
